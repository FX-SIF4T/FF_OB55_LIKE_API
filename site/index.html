<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ brand }} — VIP Like Service</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0a12; --bg-2:#12121f;
    --gold:#ffc542; --gold-2:#ff9d00;
    --red:#ff2d55; --cyan:#00e5ff; --green:#00ff9d;
    --text:#eaf2ff; --muted:#8b93b0; --purple:#a855f7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Rajdhani',sans-serif;
    background:radial-gradient(circle at 20% 10%,#1a1030 0%,var(--bg-1) 45%,#05050a 100%);
    color:var(--text);min-height:100vh;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,197,66,0.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,197,66,0.04) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0;
  }
  .wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:30px 18px 60px;}

  header{text-align:center;margin-bottom:28px;}
  .logo{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(26px,6vw,48px);letter-spacing:2px;
    background:linear-gradient(90deg,var(--gold),#fff5c2,var(--gold-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,197,66,0.35);
    animation:glow 3s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 8px rgba(255,197,66,0.5));}
    50%{filter:drop-shadow(0 0 22px rgba(255,157,0,0.9));}
  }
  .subtitle{margin-top:6px;color:var(--muted);font-size:15px;letter-spacing:4px;text-transform:uppercase;}
  .badge-vip{
    display:inline-block;margin-top:12px;padding:6px 18px;
    border:1px solid var(--gold);border-radius:30px;color:var(--gold);
    font-size:12px;letter-spacing:2px;font-weight:700;
    background:rgba(255,197,66,0.06);
    box-shadow:0 0 22px rgba(255,197,66,0.2);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 22px rgba(255,197,66,0.2);}
    50%{box-shadow:0 0 34px rgba(255,157,0,0.45);}
  }

  .card{
    background:linear-gradient(160deg,rgba(20,20,35,0.95),rgba(10,10,20,0.95));
    border:1px solid rgba(255,197,66,0.18);border-radius:18px;
    padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 0 40px rgba(255,197,66,0.03);
    backdrop-filter:blur(8px);
  }
  .card + .card{margin-top:22px;}

  label{display:block;font-weight:700;font-size:13px;letter-spacing:2px;
        text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  input,select{
    width:100%;padding:13px 15px;background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,197,66,0.25);border-radius:10px;
    color:var(--text);font-size:16px;font-family:'Rajdhani',sans-serif;font-weight:600;
    outline:none;transition:.2s;
  }
  input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,66,0.15);}

  .field + .field{margin-top:16px;}

  .regions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .chip{
    flex:1 1 auto;min-width:70px;text-align:center;padding:10px 8px;
    border-radius:10px;border:1px solid rgba(255,197,66,0.25);
    background:rgba(0,0,0,0.4);color:var(--muted);font-weight:700;
    letter-spacing:2px;cursor:pointer;transition:.2s;user-select:none;font-size:14px;
  }
  .chip:hover{color:var(--gold);border-color:var(--gold);}
  .chip.active{
    color:#000;background:linear-gradient(135deg,var(--gold),var(--gold-2));
    border-color:var(--gold);box-shadow:0 0 20px rgba(255,197,66,0.4);
  }

  .btn{
    width:100%;margin-top:22px;padding:16px;border:none;border-radius:12px;
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:17px;letter-spacing:3px;
    color:#1a0f00;background:linear-gradient(135deg,var(--gold),var(--gold-2));
    cursor:pointer;transition:.25s;box-shadow:0 10px 30px rgba(255,157,0,0.35);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(255,157,0,0.55);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn .spinner{
    display:inline-block;width:16px;height:16px;
    border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;
    animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .result{display:none;}
  .result.show{display:block;animation:fadeUp .4s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  .player-header{text-align:center;padding-bottom:18px;
    border-bottom:1px dashed rgba(255,197,66,0.25);margin-bottom:18px;}
  .player-avatar{
    width:70px;height:70px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;background:linear-gradient(135deg,var(--gold),var(--gold-2));
    box-shadow:0 0 30px rgba(255,197,66,0.5);
  }
  .player-name{
    font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;
    color:var(--gold);text-shadow:0 0 20px rgba(255,197,66,0.5);word-break:break-word;
  }
  .player-uid{color:var(--muted);font-size:14px;letter-spacing:1.5px;margin-top:6px;}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:480px){.stats{grid-template-columns:1fr;}}

  .stat{padding:16px;border-radius:12px;background:rgba(0,0,0,0.35);
        border:1px solid rgba(255,197,66,0.15);}
  .stat .k{font-size:12px;letter-spacing:2px;color:var(--muted);
           text-transform:uppercase;font-weight:700;}
  .stat .v{margin-top:6px;font-family:'Orbitron',sans-serif;font-size:22px;
           font-weight:900;color:var(--text);}
  .stat.before .v{color:#ff6b6b;}
  .stat.after  .v{color:var(--cyan);}
  .stat.given  .v{color:var(--green);}
  .stat.gift   .v{color:var(--gold);}
  .stat.live   .v{color:var(--purple);}

  .status-pill{display:inline-block;margin-top:14px;padding:6px 18px;border-radius:30px;
    font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase;}
  .status-ok{background:rgba(0,255,157,0.12);color:var(--green);border:1px solid var(--green);}
  .status-fail{background:rgba(255,45,85,0.12);color:var(--red);border:1px solid var(--red);}

  .error-box{padding:14px 16px;border-radius:10px;background:rgba(255,45,85,0.1);
    border:1px solid rgba(255,45,85,0.4);color:#ffb3c1;font-weight:600;}

  .meta-row{display:flex;justify-content:space-between;margin-top:14px;
    font-size:13px;color:var(--muted);letter-spacing:1.5px;flex-wrap:wrap;gap:8px;}

  footer{text-align:center;margin-top:34px;color:var(--muted);
         font-size:13px;letter-spacing:2px;}
  footer a{color:var(--gold);text-decoration:none;}
  footer a:hover{text-shadow:0 0 12px var(--gold);}

  :root{
    --bg-1:#080a12;
    --bg-2:#111525;
    --panel:rgba(17,21,37,.78);
    --panel-strong:rgba(21,26,45,.94);
    --line:rgba(255,255,255,.09);
    --gold:#ffc857;
    --gold-2:#ff9f1c;
    --text:#f5f7ff;
    --muted:#8f9ab7;
    --blue:#75a7ff;
  }
  html{background:var(--bg-1);}
  body{
    background:
      radial-gradient(900px 520px at 8% 0%,rgba(103,63,190,.23),transparent 68%),
      radial-gradient(700px 480px at 94% 74%,rgba(255,159,28,.11),transparent 70%),
      linear-gradient(145deg,var(--bg-2),var(--bg-1) 62%);
    color:var(--text);
  }
  body::before{
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:linear-gradient(to bottom,black,transparent 78%);
  }
  body::after{
    content:"";
    position:fixed;
    width:420px;height:420px;
    right:-170px;top:18%;
    border:1px solid rgba(255,200,87,.13);
    border-radius:50%;
    box-shadow:0 0 0 34px rgba(255,200,87,.025),0 0 0 68px rgba(255,200,87,.018);
    pointer-events:none;
  }
  .wrap{max-width:1180px;padding:24px 28px 42px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 0;border-bottom:1px solid var(--line);
  }
  .brand-lockup{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;display:grid;place-items:center;
    border:1px solid rgba(255,200,87,.65);border-radius:11px;
    color:#18120a;background:linear-gradient(145deg,var(--gold),var(--gold-2));
    font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;
    box-shadow:0 0 25px rgba(255,159,28,.22);
  }
  .brand-name{
    font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;
    letter-spacing:2px;color:var(--text);
  }
  .brand-meta{margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:2px;}
  .live-state{
    display:flex;align-items:center;gap:8px;
    color:#a9b5d2;font-size:10px;font-weight:700;letter-spacing:1.7px;
  }
  .live-state span{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#4ef0a1;box-shadow:0 0 12px #4ef0a1;
  }
  .dashboard{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(390px,.88fr);
    gap:34px;align-items:start;margin-top:78px;
  }
  .hero-copy{padding:30px 16px 0 4px;animation:fadeUp .55s ease both;}
  .hero-brand{
    position:relative;
    padding-left:24px;
    font-family:'Orbitron',sans-serif;
    max-width:100%;
    overflow-wrap:anywhere;
    font-size:clamp(28px,3.5vw,50px);
    line-height:1.08;
    letter-spacing:clamp(0px,.25vw,3px);
    color:var(--text);
    text-shadow:0 0 34px rgba(255,200,87,.14);
  }
  .hero-brand::before{
    content:"";
    position:absolute;
    left:0;top:8px;bottom:8px;width:4px;
    border-radius:8px;
    background:linear-gradient(var(--gold),var(--gold-2));
    box-shadow:0 0 18px rgba(255,159,28,.55);
  }
  .eyebrow{
    display:flex;align-items:center;gap:10px;
    color:var(--gold);font-size:11px;font-weight:700;letter-spacing:2.6px;
  }
  .eyebrow span{
    display:grid;place-items:center;width:26px;height:22px;
    border:1px solid rgba(255,200,87,.42);border-radius:6px;
    color:#201708;font-size:10px;background:var(--gold);
  }
  .hero-copy h1{
    max-width:600px;margin:22px 0 18px;
    font-family:'Orbitron',sans-serif;font-size:clamp(42px,6vw,78px);
    line-height:1.02;letter-spacing:-2px;color:var(--text);
  }
  .hero-copy h1 em{font-style:normal;color:var(--gold);text-shadow:0 0 28px rgba(255,200,87,.28);}
  .hero-description{
    max-width:480px;margin:0;color:var(--muted);
    font-size:17px;line-height:1.65;letter-spacing:.2px;
  }
  .hero-stats{
    display:flex;gap:28px;margin-top:38px;padding-top:20px;
    border-top:1px solid var(--line);
  }
  .hero-stats div{display:flex;flex-direction:column;gap:5px;}
  .hero-stats strong{font-family:'Orbitron',sans-serif;color:var(--text);font-size:14px;letter-spacing:1px;}
  .hero-stats span{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;}
  .badge-vip{
    margin-top:35px;padding:8px 13px;border-color:rgba(255,200,87,.32);
    color:#d8b86d;background:rgba(255,200,87,.06);font-size:10px;
    letter-spacing:2.2px;box-shadow:none;
  }
  .card{
    border:1px solid rgba(255,255,255,.1);border-radius:20px;
    background:linear-gradient(145deg,rgba(25,31,53,.86),rgba(10,13,24,.88));
    box-shadow:0 28px 80px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.04);
    backdrop-filter:blur(18px);
  }
  .form-card{
    padding:27px 27px 23px;
    animation:fadeUp .55s .08s ease both;
  }
  .card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;}
  .card-kicker{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2.2px;}
  .card-heading h2{
    margin-top:8px;color:var(--text);font-family:'Orbitron',sans-serif;
    font-size:25px;letter-spacing:1px;text-transform:uppercase;
  }
  .card-index{color:#6f7b9a;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;}
  .form-divider{height:1px;background:var(--line);margin:22px 0 23px;}
  .field + .field{margin-top:20px;}
  label{color:#cdd5ea;font-size:11px;letter-spacing:1.7px;}
  .field-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .field-label-row label{margin-bottom:0;}
  .field-hint{color:#66718c;font-size:10px;letter-spacing:.4px;}
  input,select{
    padding:14px 15px;border:1px solid rgba(164,181,226,.16);
    border-radius:11px;background:rgba(3,6,14,.58);color:var(--text);
    font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s;
  }
  input::placeholder{color:#65718d;}
  input:focus,select:focus{
    border-color:rgba(255,200,87,.75);
    background:rgba(3,6,14,.82);
    box-shadow:0 0 0 4px rgba(255,200,87,.09),0 0 24px rgba(255,159,28,.08);
  }
  .regions{gap:8px;margin-top:0;}
  .chip{
    min-width:0;padding:10px 9px;border-color:rgba(164,181,226,.14);
    border-radius:9px;background:rgba(3,6,14,.42);font-size:12px;
    letter-spacing:1px;color:#8e9ab7;
  }
  .chip span{margin-left:3px;}
  .chip:hover{border-color:rgba(255,200,87,.6);color:var(--gold);}
  .chip.active{
    color:#1a1305;border-color:var(--gold);
    background:linear-gradient(135deg,#ffd56e,var(--gold-2));
    box-shadow:0 8px 20px rgba(255,159,28,.2);
  }
  .btn{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:25px;padding:15px 17px;border:1px solid rgba(255,255,255,.18);
    border-radius:11px;color:#211607;
    background:linear-gradient(110deg,#ffd66f,var(--gold-2));
    box-shadow:0 12px 26px rgba(255,159,28,.2);
    font-size:13px;letter-spacing:2.5px;
  }
  .btn b{
    display:grid;place-items:center;width:27px;height:27px;border-radius:8px;
    background:rgba(33,22,7,.13);font-size:18px;line-height:1;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 17px 34px rgba(255,159,28,.3);}
  .form-note{
    display:flex;align-items:center;gap:8px;margin-top:17px;
    color:#71809f;font-size:11px;line-height:1.5;
  }
  .note-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);}
  .result{grid-column:2;margin-top:0;padding:25px 27px;animation:fadeUp .4s ease both;}
  .result.show{display:block;}
  .result .player-header{border-bottom-color:var(--line);}
  .result .player-avatar{background:linear-gradient(145deg,var(--gold),var(--gold-2));}
  .result .stat{background:rgba(3,6,14,.34);border-color:var(--line);}
  footer{
    display:flex;align-items:center;justify-content:center;gap:7px;margin-top:62px;padding-top:20px;
    border-top:1px solid var(--line);color:#68738e;font-size:11px;
    letter-spacing:1.2px;
  }
  footer b{color:#d9b45f;}
  footer .copyright{color:#8994ad;}
  @media (max-width:820px){
    .wrap{padding:20px 18px 30px;}
    .dashboard{grid-template-columns:1fr;gap:28px;margin-top:52px;}
    .hero-copy{padding:0 3px;}
    .hero-copy h1{font-size:clamp(42px,12vw,68px);}
    .result{grid-column:1;}
    footer{margin-top:42px;}
  }
  @media (max-width:520px){
    .brand-name{font-size:12px;letter-spacing:1.4px;}
    .brand-meta{font-size:8px;letter-spacing:1.2px;}
    .live-state{font-size:9px;letter-spacing:1px;}
    .hero-stats{gap:16px;}
    .hero-stats span{font-size:9px;letter-spacing:.7px;}
    .form-card,.result{padding:22px 18px;}
    .regions{display:grid;grid-template-columns:repeat(3,1fr);}
    .chip{flex:1;}
    footer{flex-wrap:wrap;gap:9px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topbar">
    <div class="brand-lockup">
      <div class="brand-mark">FX</div>
      <div>
        <div class="brand-name">{{ brand }}</div>
        <div class="brand-meta">LIVE DELIVERY NETWORK</div>
      </div>
    </div>
    <div class="live-state"><span></span> SYSTEM ONLINE</div>
  </nav>

  <main class="dashboard">
    <section class="hero-copy">
      <div class="hero-brand">{{ brand }}</div>
    </section>

    <section class="card form-card">
      <div class="card-heading">
        <div>
          <div class="card-kicker">START A REQUEST</div>
          <h2>Send likes</h2>
        </div>
        <div class="card-index">01 / 02</div>
      </div>
      <div class="form-divider"></div>

      <div class="field">
        <label for="uid">Player UID</label>
        <input id="uid" type="text" inputmode="numeric" placeholder="Enter target player UID" autocomplete="off" />
      </div>

      <div class="field">
        <label for="key">API Key</label>
        <input id="key" type="text" placeholder="Enter your API key" autocomplete="off" />
      </div>

      <div class="field">
        <div class="field-label-row">
          <label>Select Region</label>
          <span class="field-hint">Choose the player server</span>
        </div>
        <div class="regions" id="regions">
          <div class="chip active" data-region="BD">🇧🇩 <span>BD</span></div>
          <div class="chip" data-region="IND">🇮🇳 <span>IND</span></div>
          <div class="chip" data-region="BR">🇧🇷 <span>BR</span></div>
          <div class="chip" data-region="US">🇺🇸 <span>US</span></div>
          <div class="chip" data-region="SAC">🌎 <span>SAC</span></div>
          <div class="chip" data-region="NA">🌐 <span>NA</span></div>
        </div>
      </div>

      <button class="btn" id="submitBtn"><span>SEND LIKES</span><b>↗</b></button>
      <div class="form-note"><span class="note-dot"></span> Requests are processed live across the selected region.</div>
    </section>

    <section class="card result" id="resultCard">
      <div id="resultBody"></div>
    </section>
  </main>

  <footer>
    <span>Built by <b>{{ dev }}</b> <span class="copyright">©2026</span></span>
  </footer>

</div>

<script>
const API_BASE = "";

let selectedRegion = "BD";
const chips = document.querySelectorAll(".chip");
chips.forEach(c => {
  c.addEventListener("click", () => {
    chips.forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    selectedRegion = c.dataset.region;
  });
});

const btn = document.getElementById("submitBtn");
const resultCard = document.getElementById("resultCard");
const resultBody = document.getElementById("resultBody");

btn.addEventListener("click", async () => {
  const uid = document.getElementById("uid").value.trim();
  const key = document.getElementById("key").value.trim();

  if (!uid) { showError("Please enter a Player UID"); return; }
  if (!key) { showError("Please enter your API Key"); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> PROCESSING...';
  resultCard.classList.remove("show");

  try {
    const url = `${API_BASE}/like?uid=${encodeURIComponent(uid)}&server_name=${encodeURIComponent(selectedRegion)}&key=${encodeURIComponent(key)}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (!resp.ok || data.error) {
      showError(data.error || `Request failed (${resp.status})`);
      return;
    }
    showResult(data);
  } catch (e) {
    showError("Network error: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "🚀 SEND LIKES";
  }
});

function showError(msg) {
  resultBody.innerHTML = `<div class="error-box">⚠️ ${escapeHtml(msg)}</div>`;
  resultCard.classList.add("show");
}

function showResult(d) {
  const ok = d.status === 1;
  const pill = ok
    ? `<div class="status-pill status-ok">✔ SUCCESS</div>`
    : `<div class="status-pill status-fail">✖ NO LIKES GIVEN</div>`;

  resultBody.innerHTML = `
    <div class="player-header">
      <div class="player-avatar">🎮</div>
      <div class="player-name">${escapeHtml(d.PlayerNickname || "Unknown")}</div>
      <div class="player-uid">UID: ${escapeHtml(String(d.UID || ""))}</div>
      ${pill}
    </div>

    <div class="stats">
      <div class="stat before">
        <div class="k">Likes Before</div>
        <div class="v">${d.LikesbeforeCommand ?? 0}</div>
      </div>
      <div class="stat after">
        <div class="k">Likes After</div>
        <div class="v">${d.LikesafterCommand ?? 0}</div>
      </div>
      <div class="stat given">
        <div class="k">Likes Given</div>
        <div class="v">+${d.LikesGivenByAPI ?? 0}</div>
      </div>
      <div class="stat gift">
        <div class="k">Gift Received</div>
        <div class="v">🎁 ${d.GiftCount ?? 0}</div>
      </div>
      <div class="stat live">
        <div class="k">Accounts Loaded</div>
        <div class="v">${d.accounts_loaded ?? 0}</div>
      </div>
      <div class="stat live">
        <div class="k">Tokens Generated (Live)</div>
        <div class="v">${d.tokens_generated ?? 0}</div>
      </div>
    </div>

    <div class="meta-row">
      <span>Region: <b style="color:var(--gold)">${escapeHtml(d.server_name || "")}</b></span>
      <span>Owner: <b style="color:var(--gold)">${escapeHtml(d.Owner || "")}</b></span>
    </div>
  `;
  resultCard.classList.add("show");
  resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
</script>
</body>
</html>
